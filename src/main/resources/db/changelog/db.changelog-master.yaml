databaseChangeLog:
  - changeSet:
      id: O000001
      author: jdev
      changes:
        - sql:
            sql: >-
              create extension if not exists "uuid-ossp";
              create extension if not exists postgis;
  - changeSet:
      id: O000002
      author: jdev
      changes:
        - createSequence:
            cycle: false
            dataType: INTEGER
            startValue: 1
            incrementBy: 1
            minValue: 1
            maxValue: 2147483647
            schemaName: public
            sequenceName: delivery_user_id_seq
        - createTable:
            tableName: delivery_users
            columns:
              - column:
                  name: id
                  type: INTEGER
                  remarks: ID Unique, PK
                  defaultValueComputed: nextval('delivery_user_id_seq')
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_delivery_user_id
              - column:
                  name: delivery_uuid
                  type: UUID
                  remarks: Deliverer Keycloak User ID
                  constraints:
                    nullable: false
              - column:
                  name: zone_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
              - column:
                  name: last_position
                  type: GEOGRAPHY(Point)
                  remarks: longitud, latitud address location
  - changeSet:
      id: O000003
      author: jdev
      changes:
        - createSequence:
            cycle: false
            dataType: BIGINT
            startValue: 1
            incrementBy: 1
            minValue: 1
            maxValue: 9223372036854775807
            schemaName: public
            sequenceName: pos_order_id_seq
        - createTable:
            tableName: pos_order
            columns:
              - column:
                  name: id
                  type: BIGINT
                  remarks: ID Unique, PK
                  defaultValueComputed: nextval('pos_order_id_seq')
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_pos_order_id
              - column:
                  name: user_uuid
                  type: UUID
                  remarks: Keycloak user ID
                  constraints:
                    nullable: false
              - column:
                  name: restaurant_tmpl_id
                  type: INTEGER
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR
                  constraints:
                    nullable: false
              - column:
                  name: notes
                  type: VARCHAR
                  remarks: Customer notes
              - column:
                  name: adjustments
                  type: JSONB
                  remarks: "Lista de cargos y descuentos relacionados con la orden"
                  defaultValue: '[]'
              - column:
                  name: total_amount_restaurant
                  type: DECIMAL(10, 2)
                  constraints:
                    nullable: false
              - column:
                  name: total_amount
                  type: DECIMAL(10, 2)
                  constraints:
                    nullable: false
              - column:
                  name: created_date
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
  - changeSet:
      id: O000004
      author: jdev
      changes:
        - createSequence:
            cycle: false
            dataType: BIGINT
            startValue: 1
            incrementBy: 1
            minValue: 1
            maxValue: 9223372036854775807
            schemaName: public
            sequenceName: pos_order_line_id_seq
        - createTable:
            tableName: pos_order_line
            columns:
              - column:
                  name: id
                  type: BIGINT
                  remarks: ID Unique, PK
                  defaultValueComputed: nextval('pos_order_line_id_seq')
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_pos_order_line_id
              - column:
                  name: order_id
                  type: BIGINT
                  remarks: Order Ref
              - column:
                  name: product_tmpl_id
                  type: INTEGER
                  remarks: Product template
              - column:
                  name: qty
                  type: smallint
                  remarks: Quantity
              - column:
                  name: price_unit
                  type: DECIMAL(10, 2)
              - column:
                  name: price_total
                  type: DECIMAL(10, 2)
              - column:
                  name: attributes
                  type: VARCHAR(120) ARRAY
              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  remarks: Created on
        - addForeignKeyConstraint:
            baseColumnNames: order_id
            baseTableName: pos_order_line
            constraintName: pos_order_line_order_id_fkey
            referencedColumnNames: id
            referencedTableName: pos_order
            onDelete: CASCADE
            validate: true
  - changeSet:
      id: O000005
      author: jdev
      changes:
        - addColumn:
            tableName: pos_order
            columns:
              - column:
                  name: zone_id
                  type: INTEGER
  - changeSet:
      id: O000006
      author: jdev
      changes:
        - sql:
            sql: >-
              DROP TYPE IF EXISTS pos_order_status;
              CREATE TYPE pos_order_status AS ENUM ('ORDERED', 'ACCEPTED', 'COOKING', 'READY_FOR_DELIVERY', 'DELIVERY_ASSIGNED_ORDER', 'DELIVERY_ROAD_TO_STORE', 'DELIVERY_ROAD_TO_DESTINATION', 'DELIVERED', 'CANCELLED', 'REJECTED', 'READY_FOR_PICKUP');
              ALTER TABLE pos_order ALTER COLUMN status TYPE pos_order_status USING status::pos_order_status;
        - createSequence:
            cycle: false
            dataType: BIGINT
            startValue: 1
            incrementBy: 1
            minValue: 1
            maxValue: 9223372036854775807
            schemaName: public
            sequenceName: pos_restaurant_kanban_id_seq
        - createTable:
            tableName: pos_restaurant_kanban
            columns:
              - column:
                  name: id
                  type: BIGINT
                  remarks: ID Unique, PK
                  defaultValueComputed: nextval('pos_restaurant_kanban_id_seq')
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_pos_restaurant_kanban_id
              - column:
                  name: order_id
                  type: BIGINT
              - column:
                  name: restaurant_id
                  type: INTEGER
        - addForeignKeyConstraint:
            baseColumnNames: order_id
            baseTableName: pos_restaurant_kanban
            constraintName: pos_restaurant_kanban_pos_order_fkey
            referencedColumnNames: id
            referencedTableName: pos_order
            validate: true
        - createIndex:
            tableName: pos_restaurant_kanban
            indexName: idx_pos_restaurant_kanban_restaurant_id
            columns:
              - column:
                  name: restaurant_id
            using: hash

  - changeSet:
      id: O000007
      author: jdev
      changes:
        - createTable:
            tableName: pos_restaurant_info
            columns:
              - column:
                  name: id
                  type: INTEGER
                  remarks: ID Unique, PK
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_pos_restaurant_id
              - column:
                  name: name
                  type: VARCHAR
              - column:
                  name: address
                  type: VARCHAR
              - column:
                  name: image_logo_url
                  type: VARCHAR
              - column:
                  name: position
                  type: GEOGRAPHY(Point)
                  remarks: longitud, latitud address location
  - changeSet:
      id: O000008
      author: jdev
      changes:
        - createTable:
            tableName: pos_product_info
            columns:
              - column:
                  name: id
                  type: INTEGER
                  remarks: ID Unique, PK
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_pos_product_id
              - column:
                  name: name
                  type: VARCHAR
              - column:
                  name: description
                  type: VARCHAR
              - column:
                  name: picture_logo_url
                  type: VARCHAR
  - changeSet:
      id: O000009
      author: jdev
      changes:
        - addColumn:
            tableName: pos_order
            columns:
              - column:
                  name: user_address_id
                  type: INTEGER
              - column:
                  name: delivery_location
                  type: GEOGRAPHY(Point)
              - column:
                  name: shoppingcart_id
                  type: UUID

  - changeSet:
      id: O000010
      author: jdev
      changes:
        - createTable:
            tableName: pos_user_addresss
            columns:
              - column:
                  name: id
                  type: INTEGER
                  remarks: ID Unique, PK
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: pk_pos_user_address_id
              - column:
                  name: type_address
                  type: VARCHAR
              - column:
                  name: details
                  type: VARCHAR
              - column:
                  name: street
                  type: VARCHAR
              - column:
                  name: address
                  type: VARCHAR
              - column:
                  name: indications
                  type: VARCHAR
  - changeSet:
      id: O000011
      author: jdev
      changes:
        - createTable:
            tableName: outbox_event
            columns:
              - column:
                  name: id
                  type: UUID
                  remarks: ID Unique, PK
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: outbox_event_id
              - column:
                  name: aggregate_id
                  type: BIGINT
              - column:
                  name: type
                  type: VARCHAR(100)
              - column:
                  name: payload
                  type: JSONB
              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  remarks: Created on

  - changeSet:
      id: O000012
      author: jdev
      changes:
        - createTable:
            tableName: delivery_user_order_rel
            columns:
              - column:
                  name: id
                  type: UUID
                  defaultValue: uuid_generate_v4()
                  constraints:
                    nullable: false
                    primaryKey: true
                    primaryKeyName: delivery_user_order_rel_id
              - column:
                  name: delivery_user_id
                  type: INTEGER
              - column:
                  name: order_id
                  type: BIGINT
              - column:
                  name: status
                  type: VARCHAR(50)
              - column:
                  name: created_at
                  type: TIMESTAMP WITHOUT TIME ZONE
                  defaultValueComputed: CURRENT_TIMESTAMP
                  remarks: Created on

  - changeSet:
      id: O000013
      author: jdev
      changes:
        - addColumn:
            tableName: pos_order
            columns:
              - column:
                  name: delivery_user_order_rel_id
                  type: UUID

  - changeSet:
      id: O000014
      author: jdev
      changes:
        - addColumn:
            tableName: pos_order
            columns:
              - column:
                  name: delivery_assignment_attempts
                  type: smallint
                  defaultValueComputed: 0
  - changeSet:
      id: O000015
      author: jdev
      changes:
        - addColumn:
            tableName: pos_order
            columns:
              - column:
                  name: ready_for_delivery_date
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: delivery_assigned_date
                  type: TIMESTAMP WITH TIME ZONE
              - column:
                  name: delivered_date
                  type: TIMESTAMP WITH TIME ZONE
        - addColumn:
            tableName: pos_order
            columns:
              - column:
                  name: created_at_utc
                  type: TIMESTAMP WITH TIME ZONE
        - sql:
            sql: |
              UPDATE pos_order
              SET created_at_utc = created_date AT TIME ZONE 'America/Mexico_City';
        - dropColumn:
            tableName: pos_order
            columnName: created_date
        - renameColumn:
            tableName: pos_order
            oldColumnName: created_at_utc
            newColumnName: created_at
  - changeSet:
      id: O000016
      author: jdev
      changes:
        - sql:
            sql: >-
              CREATE INDEX idx_order_ready_fifo_attempts ON pos_order (ready_for_delivery_date ASC, delivery_assignment_attempts DESC) WHERE status = 'READY_FOR_DELIVERY';
  - changeSet:
      id: O000017
      author: jdev
      changes:
        - addColumn:
            tableName: delivery_users
            columns:
              - column:
                  name: name
                  type: VARCHAR(50)
              - column:
                  name: last_name
                  type: VARCHAR(100)
              - column:
                  name: picture_url
                  type: VARCHAR
  - changeSet:
      id: O000018
      author: jdev
      changes:
        - sql:
            sql: >-
              DROP INDEX idx_order_ready_fifo_attempts;
        - renameColumn:
            tableName: pos_order
            oldColumnName: created_at
            newColumnName: ordered_at
        - renameColumn:
            tableName: pos_order
            oldColumnName: ready_for_delivery_date
            newColumnName: ready_for_delivery_at
        - renameColumn:
            tableName: pos_order
            oldColumnName: delivery_assigned_date
            newColumnName: delivery_assigned_at
        - renameColumn:
            tableName: pos_order
            oldColumnName: delivered_date
            newColumnName: delivered_at
        - sql:
            sql: >-
              CREATE INDEX idx_order_ready_fifo_attempts ON pos_order (ready_for_delivery_at ASC, delivery_assignment_attempts DESC) WHERE status = 'READY_FOR_DELIVERY';
  - changeSet:
      id: O000019
      author: jdev
      changes:
        - addColumn:
            tableName: pos_order
            columns:
              - column:
                  name: code
                  type: VARCHAR(50)
  - changeSet:
      id: O000020
      author: jdev
      changes:
        - addColumn:
            tableName: delivery_users
            columns:
              - column:
                  name: username
                  type: VARCHAR(50)
              - column:
                  name: email
                  type: VARCHAR(75)
        - addUniqueConstraint:
            columnNames: username
            constraintName: unique_username
            schemaName: public
            tableName: delivery_users
            validate: true
        - addUniqueConstraint:
            columnNames: email
            constraintName: unique_email
            schemaName: public
            tableName: delivery_users
            validate: true
  - changeSet:
      id: O000021
      author: jdev
      changes:
        - addColumn:
            tableName: delivery_user_order_rel
            columns:
              - column:
                  name: route_geometry
                  type: TEXT
              - column:
                  name: distance
                  type: DOUBLE PRECISION
              - column:
                  name: duration
                  type: DOUBLE PRECISION
              - column:
                  name: last_lat
                  type: double precision
                  remarks: DOUBLE PRECISION
              - column:
                  name: last_lng
                  type: double precision
                  remarks: DOUBLE PRECISION
